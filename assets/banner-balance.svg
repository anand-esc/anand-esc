<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 388" width="100%" role="img" aria-label="Hello, this is Suryansh Anand, AI and ML Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="45%" stop-color="#ff4fa3" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ff4fa3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4fa3" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff4fa3" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ff4fa3" stop-opacity="0"/>
    </linearGradient>

    <filter id="glowWide" filterUnits="userSpaceOnUse" x="-60" y="-60" width="1320" height="508">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="glowMid" filterUnits="userSpaceOnUse" x="-60" y="-60" width="1320" height="508">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="glowTight" filterUnits="userSpaceOnUse" x="-60" y="-60" width="1320" height="508">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <style>
      .t {
        font-family: 'Montserrat', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        text-anchor: middle;
      }
      .name  { font-size: 84px; font-weight: 300; }
      .small { font-size: 25px; font-weight: 300; fill: #d9d9d9; }
      .role  { font-size: 29px; font-weight: 300; fill: #d9d9d9; }
      .bold  { font-weight: 700; fill: #ffffff; }
    </style>

    <!-- Neural-network motif (left side; mirrored on the right) -->
    <g id="net">
      <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="1">
      <line x1="40" y1="120" x2="100" y2="80"/>
      <line x1="40" y1="120" x2="100" y2="157"/>
      <line x1="40" y1="120" x2="100" y2="231"/>
      <line x1="40" y1="120" x2="100" y2="308"/>
      <line x1="40" y1="194" x2="100" y2="80"/>
      <line x1="40" y1="194" x2="100" y2="157"/>
      <line x1="40" y1="194" x2="100" y2="231"/>
      <line x1="40" y1="194" x2="100" y2="308"/>
      <line x1="40" y1="268" x2="100" y2="80"/>
      <line x1="40" y1="268" x2="100" y2="157"/>
      <line x1="40" y1="268" x2="100" y2="231"/>
      <line x1="40" y1="268" x2="100" y2="308"/>
      <line x1="100" y1="80" x2="160" y2="120"/>
      <line x1="100" y1="80" x2="160" y2="194"/>
      <line x1="100" y1="80" x2="160" y2="268"/>
      <line x1="100" y1="157" x2="160" y2="120"/>
      <line x1="100" y1="157" x2="160" y2="194"/>
      <line x1="100" y1="157" x2="160" y2="268"/>
      <line x1="100" y1="231" x2="160" y2="120"/>
      <line x1="100" y1="231" x2="160" y2="194"/>
      <line x1="100" y1="231" x2="160" y2="268"/>
      <line x1="100" y1="308" x2="160" y2="120"/>
      <line x1="100" y1="308" x2="160" y2="194"/>
      <line x1="100" y1="308" x2="160" y2="268"/>
      </g>
      <circle cx="40" cy="120" r="4.5" fill="#ffffff"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.0s" repeatCount="indefinite"/></circle>
      <circle cx="40" cy="194" r="4.5" fill="#ffffff"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.45s" repeatCount="indefinite"/></circle>
      <circle cx="40" cy="268" r="4.5" fill="#ffffff"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="100" cy="80" r="4.5" fill="#ff4fa3"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="100" cy="157" r="4.5" fill="#ff4fa3"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.05s" repeatCount="indefinite"/></circle>
      <circle cx="100" cy="231" r="4.5" fill="#ff4fa3"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="100" cy="308" r="4.5" fill="#ff4fa3"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.95s" repeatCount="indefinite"/></circle>
      <circle cx="160" cy="120" r="4.5" fill="#ffffff"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="160" cy="194" r="4.5" fill="#ffffff"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.65s" repeatCount="indefinite"/></circle>
      <circle cx="160" cy="268" r="4.5" fill="#ffffff"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="2.1s" repeatCount="indefinite"/></circle>
    </g>
  </defs>

  <!-- Black background + faint bloom -->
  <rect width="1200" height="388" fill="#000000"/>
  <ellipse cx="600" cy="194" rx="560" ry="150" fill="url(#bloom)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Neural nets either side -->
  <use href="#net"/>
  <use href="#net" transform="translate(1200,0) scale(-1,1)"/>

  <!-- Faint static border -->
  <rect x="12" y="12" width="1176" height="364" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Two beams: one white, one accent, opposite sides of the border -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#ffffff">
      <rect x="12" y="12" width="1176" height="364" rx="18" pathLength="100" stroke-width="10" stroke-dasharray="9 91" opacity="0.5" filter="url(#glowWide)">
        <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="12" y="12" width="1176" height="364" rx="18" pathLength="100" stroke-width="5" stroke-dasharray="9 91" opacity="0.9" filter="url(#glowMid)">
        <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="12" y="12" width="1176" height="364" rx="18" pathLength="100" stroke-width="2.5" stroke-dasharray="7 93">
        <animate attributeName="stroke-dashoffset" from="-1" to="-101" dur="8s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g stroke="#ff4fa3">
      <rect x="12" y="12" width="1176" height="364" rx="18" pathLength="100" stroke-width="10" stroke-dasharray="9 91" opacity="0.55" filter="url(#glowWide)">
        <animate attributeName="stroke-dashoffset" from="-50" to="-150" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="12" y="12" width="1176" height="364" rx="18" pathLength="100" stroke-width="5" stroke-dasharray="9 91" opacity="0.9" filter="url(#glowMid)">
        <animate attributeName="stroke-dashoffset" from="-50" to="-150" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="12" y="12" width="1176" height="364" rx="18" pathLength="100" stroke-width="2.5" stroke-dasharray="7 93">
        <animate attributeName="stroke-dashoffset" from="-51" to="-151" dur="8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Name: pink halo outside, white neon core -->
  <text class="t name" x="600" y="226" textLength="820" lengthAdjust="spacing" fill="#ff4fa3" filter="url(#glowWide)" opacity="0.6">SURYANSH ANAND
    <animate attributeName="opacity" values="0.4;0.75;0.5;0.75;0.4" dur="3.5s" repeatCount="indefinite"/>
  </text>
  <text class="t name" x="600" y="226" textLength="820" lengthAdjust="spacing" fill="#ffffff" filter="url(#glowMid)" opacity="0.85">SURYANSH ANAND
    <animate attributeName="opacity" values="0.65;1;0.75;1;0.65" dur="3.5s" repeatCount="indefinite"/>
  </text>
  <text class="t name" x="600" y="226" textLength="820" lengthAdjust="spacing" fill="#ffffff" filter="url(#glowTight)">SURYANSH ANAND</text>
  <text class="t name" x="600" y="226" textLength="820" lengthAdjust="spacing" fill="#ffffff">SURYANSH ANAND</text>

  <!-- Greeting -->
  <text class="t small" x="600" y="118" textLength="340" lengthAdjust="spacing">HELLO 👋, THIS IS</text>

  <!-- Role + accent rule -->
  <text class="t role" x="600" y="298" textLength="470" lengthAdjust="spacing">AI AND ML <tspan class="bold">DEVELOPER</tspan></text>
  <rect x="450" y="318" width="300" height="2" fill="url(#rule)"/>

  <!-- Fade-in on load -->
  <rect width="1200" height="388" fill="#000000" opacity="0">
    <animate attributeName="opacity" values="1;0" dur="1.2s" fill="freeze"/>
  </rect>
</svg>
