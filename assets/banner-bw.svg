<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 388" width="100%" role="img" aria-label="Hello, this is Suryansh Anand, AI and ML Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .t {
        font-family: 'Montserrat', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        text-anchor: middle;
      }
      .name  { font-size: 96px; font-weight: 300; fill: #ffffff; }
      .small { font-size: 27px; font-weight: 300; fill: #bdbdbd; }
      .role  { font-size: 31px; font-weight: 300; fill: #bdbdbd; }
      .bold  { font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <!-- Plain black background -->
  <rect width="1200" height="388" fill="#000000"/>

  <!-- Greeting line -->
  <text class="t small" x="600" y="112" textLength="370" lengthAdjust="spacing">HELLO 👋, THIS IS</text>

  <!-- Name -->
  <text class="t name" x="600" y="236" textLength="960" lengthAdjust="spacing">SURYANSH ANAND</text>

  <!-- Role line -->
  <text class="t role" x="600" y="306" textLength="500" lengthAdjust="spacing">AI AND ML <tspan class="bold">DEVELOPER</tspan></text>
</svg>
