<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 388" width="100%" role="img" aria-label="Hello, this is Suryansh Anand, AI and ML Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Soft white bloom behind the text -->
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow filters (userSpaceOnUse so thin strokes don't get clipped) -->
    <filter id="glowWide" filterUnits="userSpaceOnUse" x="-60" y="-60" width="1320" height="508">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="glowMid" filterUnits="userSpaceOnUse" x="-60" y="-60" width="1320" height="508">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="glowTight" filterUnits="userSpaceOnUse" x="-60" y="-60" width="1320" height="508">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <style>
      .t {
        font-family: 'Montserrat', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        text-anchor: middle;
      }
      .name  { font-size: 112px; font-weight: 300; }
      .small { font-size: 27px;  font-weight: 300; fill: #d9d9d9; }
      .role  { font-size: 31px;  font-weight: 300; fill: #d9d9d9; }
      .bold  { font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <!-- Black background -->
  <rect width="1200" height="388" fill="#000000"/>
  <ellipse cx="600" cy="196" rx="560" ry="150" fill="url(#bloom)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Faint static border -->
  <rect x="12" y="12" width="1176" height="364" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Beams of light travelling around the border (two, on opposite sides) -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <rect x="12" y="12" width="1176" height="364" rx="18" pathLength="100"
          stroke-width="10" stroke-dasharray="9 41" opacity="0.55" filter="url(#glowWide)">
      <animate attributeName="stroke-dashoffset" from="0" to="-50" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="12" y="12" width="1176" height="364" rx="18" pathLength="100"
          stroke-width="5" stroke-dasharray="9 41" opacity="0.9" filter="url(#glowMid)">
      <animate attributeName="stroke-dashoffset" from="0" to="-50" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="12" y="12" width="1176" height="364" rx="18" pathLength="100"
          stroke-width="2.5" stroke-dasharray="7 43">
      <animate attributeName="stroke-dashoffset" from="-1" to="-51" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Neon glow layers behind the name (gentle flicker) -->
  <g fill="#ffffff">
    <text class="t name" x="600" y="236" textLength="960" lengthAdjust="spacing"
          filter="url(#glowWide)" opacity="0.7">SURYANSH ANAND
      <animate attributeName="opacity" values="0.5;0.85;0.6;0.85;0.5" dur="3.5s" repeatCount="indefinite"/>
    </text>
    <text class="t name" x="600" y="236" textLength="960" lengthAdjust="spacing"
          filter="url(#glowMid)" opacity="0.8">SURYANSH ANAND
      <animate attributeName="opacity" values="0.65;1;0.75;1;0.65" dur="3.5s" repeatCount="indefinite"/>
    </text>
    <text class="t name" x="600" y="236" textLength="960" lengthAdjust="spacing"
          filter="url(#glowTight)">SURYANSH ANAND</text>
  </g>

  <!-- Crisp white neon tube on top -->
  <text class="t name" x="600" y="236" textLength="960" lengthAdjust="spacing" fill="#ffffff">SURYANSH ANAND</text>

  <!-- Greeting line -->
  <text class="t small" x="600" y="112" textLength="330" lengthAdjust="spacing">HELLO, THIS IS</text>

  <!-- Role line -->
  <text class="t role" x="600" y="306" textLength="500" lengthAdjust="spacing">AI AND ML <tspan class="bold">DEVELOPER</tspan></text>

  <!-- Fade-in on load -->
  <rect width="1200" height="388" fill="#000000" opacity="0">
    <animate attributeName="opacity" values="1;0" dur="1.2s" fill="freeze"/>
  </rect>
</svg>
