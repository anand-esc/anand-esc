<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 556" width="100%" role="img" aria-label="Terminal card: Suryansh Anand, AI/ML Engineer. B.Tech CSE (AI and ML) at Sri Sri University. Stack: Python, JavaScript, SQL, LangChain, LangGraph, HuggingFace, RAG, GANs, Gemini API, OpenAI API, IBM Granite, React, Node.js, FastAPI, Tailwind, GCP, Firebase, Docker, CI/CD, Linux." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace; font-size: 18px; }
      .pr  { fill: #ffffff; font-weight: 700; }
      .cm  { fill: #ffffff; }
      .out { fill: #d4d4d4; }
      .hi  { fill: #ffffff; font-weight: 700; }
      .dim { fill: #8b8b8b; }
      .lab { fill: #8b8b8b; }
      .bar { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; font-size: 14px; fill: #8b8b8b; letter-spacing: 1px; text-anchor: middle; }

      /* Typewriter: visible by default, hidden only while an animation is waiting to start */
      .ch  { animation: show 0.01s steps(1, end) both; }
      .ln  { animation: fade 0.5s ease-out both; }
      .cur { animation: blink 1.1s steps(1, end) infinite; }
      @keyframes show  { from { fill-opacity: 0; } to { fill-opacity: 1; } }
      @keyframes fade  { from { opacity: 0; } to { opacity: 1; } }
      @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
    </style>
  </defs>

  <!-- Window -->
  <rect x="1" y="1" width="1198" height="554" rx="14" fill="#050505" stroke="#2b2b2b" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="552" rx="13" fill="url(#dots)"/>

