name: Update-Lines-Of-Code

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"

permissions:
  contents: write

jobs:
  update-loc:
    runs-on: ubuntu-latest
    name: calculate-github-lines-of-code
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Lines of Code Calculator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/update_loc.py

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/loc-metrics.svg assets/loc-badge.svg
          if git commit -m "chore(stats): update verified lines of code metrics [skip ci]"; then
            git push
          else
            echo "No changes to commit"
          fi
